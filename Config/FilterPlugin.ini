[FilterPlugin]
; Extra files that `RunUAT BuildPlugin` copies into the redistributable plugin package, on top of
; its default set (descriptor, Source, Resources, build products). Paths are relative to the plugin root;
; "..." is a wildcard. Cooking and staging a game never read this file.
/Config/DefaultPsData.ini
/README.md
/CHANGELOG.md
/LICENSE
/AGENTS.md
/CLAUDE.md
/llms.txt
/docs/...
